          <h2 id="打包与解压"><a href="#打包与解压" class="headerlink" title="打包与解压"></a>打包与解压</h2><h3 id="tar（gz）"><a href="#tar（gz）" class="headerlink" title="tar（gz）"></a>tar（gz）</h3><figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br></pre></td><td class="code"><pre><span class="line"><span class="comment"># 压缩</span></span><br><span class="line">tar -czvf 压缩包名称.tar.gz /路径/要压缩的文件夹或文件</span><br><span class="line"></span><br><span class="line"><span class="comment"># 解压到指定目录</span></span><br><span class="line">tar -xzvf 文件名.tar.gz -C /目标路径/</span><br></pre></td></tr></table></figure>

<ul>
<li>去掉 <code>-v</code> 参数即可静默运行。</li>
</ul>
<h3 id="zip"><a href="#zip" class="headerlink" title="zip"></a>zip</h3><figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br></pre></td><td class="code"><pre><span class="line"><span class="comment"># 压缩（-r 递归处理）</span></span><br><span class="line">zip -r 压缩包名称.zip /路径/要压缩的文件夹或文件</span><br><span class="line"></span><br><span class="line"><span class="comment"># 解压到指定目录（-q 静默运行）</span></span><br><span class="line">unzip 文件名.zip -d /目标路径/</span><br></pre></td></tr></table></figure>

<h2 id="传输文件"><a href="#传输文件" class="headerlink" title="传输文件"></a>传输文件</h2><figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><span class="line">scp /本地路径/压缩包名称 用户名@接收方IP地址:/远程目标路径/</span><br></pre></td></tr></table></figure>

<blockquote>
<p>注意：其中的冒号不能省略。</p>
</blockquote>
<h2 id="openclaw-常用命令"><a href="#openclaw-常用命令" class="headerlink" title="openclaw 常用命令"></a>openclaw 常用命令</h2><figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><span class="line">npm update -g openclaw@latest</span><br><span class="line">openclaw gateway restart</span><br></pre></td></tr></table></figure>

<p>排查问题时的几条命令：</p>
<figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br></pre></td><td class="code"><pre><span class="line">openclaw status                                  <span class="comment"># 快速看 Gateway 是否活着</span></span><br><span class="line">openclaw gateway status                          <span class="comment"># 看 systemd 状态和 PID</span></span><br><span class="line">systemctl --user status openclaw-gateway         <span class="comment"># 系统层面查找</span></span><br><span class="line">openclaw logs --follow                           <span class="comment"># 实时盯日志找报错</span></span><br><span class="line">journalctl --user -u openclaw-gateway -n 50      <span class="comment"># Gateway 起不来时看 systemd 日志</span></span><br><span class="line">cat /tmp/openclaw/openclaw-$(date +%Y-%m-%d).<span class="built_in">log</span> <span class="comment"># 直接看当天的日志文件</span></span><br></pre></td></tr></table></figure>

<script>
  window.addEventListener('tabs:register', () => {
    let { activeClass } = CONFIG.comments;
    if (CONFIG.comments.storage) {
      activeClass = localStorage.getItem('comments_active') || activeClass;
    }
    if (activeClass) {
      let activeTab = document.querySelector(`a[href="#comment-${activeClass}"]`);
      if (activeTab) {
        activeTab.click();
      }
    }
  });
  if (CONFIG.comments.storage) {
    window.addEventListener('tabs:click', event => {
      if (!event.target.matches('.tabs-comment .tab-content .tab-pane')) return;
      let commentClass = event.target.classList[1];
      localStorage.setItem('comments_active', commentClass);
    });
  }
</script>
